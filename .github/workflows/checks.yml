name: Verify node images
on:
  workflow_call:
    inputs:
      save-images:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check reachable agent vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Resolve build identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=dev
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$commit"
            version=${RELEASE_TAG#v}
            node --input-type=module -e 'import {createManifest} from "./scripts/release-manifest.mjs"; const v=process.env.RELEASE_TAG.slice(1); createManifest({tag:process.env.RELEASE_TAG,version:v,commit:"a".repeat(40),verifiedAt:new Date().toISOString(),protocolVersion:1,schemaVersion:6,architectures:Object.fromEntries(["amd64","arm64"].map(architecture=>[architecture,{version:v,commit:"a".repeat(40),architecture,reference:"ghcr.io/pulse-foundation/pulse-vpn-node@sha256:"+"1".repeat(64),imageId:"sha256:"+"2".repeat(64)}]))})'
          fi
          echo "NODE_VERSION=$version" >> "$GITHUB_ENV"
          echo "NODE_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Test release tooling
        run: node --test scripts/release-manifest.test.mjs scripts/scan-image.test.mjs
      - name: Check native Docker platform
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker version --format '{{.Server.Arch}}')" = "$EXPECTED_ARCH"
          docker compose version
      - name: Build and verify the complete node
        run: go test -tags=integration -count=1 -timeout=30m -v ./tests/integration -build-version="$NODE_VERSION" -build-commit="$NODE_COMMIT"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.1
      - name: Scan the verified image and its PostgreSQL service
        shell: bash
        run: |
          database=$(awk '$1 == "image:" && $2 ~ /^postgres:/ {print $2}' compose.yaml)
          test -n "$database"
          status=0
          bash scripts/scan-image.sh pulse-vpn-node:integration-test "$RUNNER_TEMP/security-reports/node" built-image || status=1
          bash scripts/scan-image.sh "$database" "$RUNNER_TEMP/security-reports/postgres" upstream-image || status=1
          exit "$status"
      - name: Save full security inventories and readable reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports-${{ matrix.arch }}
          path: ${{ runner.temp }}/security-reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Save the verified image
        if: inputs.save-images
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          docker image inspect pulse-vpn-node:integration-test --format '{{.Id}}' > "$RUNNER_TEMP/verified/$ARCH.id"
          docker run --rm --network none --read-only pulse-vpn-node:integration-test version > "$RUNNER_TEMP/verified/$ARCH.build.json"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/verified/$ARCH.verified-at"
          docker save pulse-vpn-node:integration-test -o "$RUNNER_TEMP/verified/$ARCH.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.save-images
        with:
          name: verified-${{ matrix.arch }}
          path: ${{ runner.temp }}/verified/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
