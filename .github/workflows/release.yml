name: Publish release image
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ghcr-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/checks.yml
    with:
      save-images: true
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo 'Expected a version tag such as v0.1.0 or v0.1.0-rc.1' >&2
            exit 1
          fi
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verified-*
          path: verified-images
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse replacing an existing release
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2> registry-error; then
            echo 'This version is already published. Release a new version.' >&2
            exit 1
          fi
          if ! grep -qiE 'manifest unknown|name unknown|not found' registry-error; then
            cat registry-error >&2
            exit 1
          fi
      - name: Publish verified images and multiarch manifest
        env:
          SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          digests=()
          for arch in amd64 arm64; do
            docker load --input "verified-images/$arch.tar"
            actual=$(docker image inspect pulse-vpn-node:integration-test --format '{{.Id}}')
            test "$actual" = "$(cat "verified-images/$arch.id")"
            test "$(docker image inspect pulse-vpn-node:integration-test --format '{{.Os}}/{{.Architecture}}')" = "linux/$arch"
            staging="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "$actual" "$staging"
            docker push "$staging"
            digest=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            digests+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            "${digests[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
