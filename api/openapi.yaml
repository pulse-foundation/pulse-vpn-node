openapi: 3.0.3
info:
  title: Pulse VPN Node
  version: 0.1.0
  description: Agent/core readiness and managed single VLESS + REALITY connection with live users.
security:
  - nodeToken: []
paths:
  /api/v1/connection:
    get:
      operationId: getConnection
      summary: Read the public verified applied VLESS connection descriptor
      description: Last verified applied transport snapshot, independent of live users. No credentials or REALITY private key are returned.
      responses:
        '200':
          description: Verified applied listener, or explicit null when VPN is not configured
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, connection]
                properties:
                  schemaVersion:
                    type: integer
                    enum: [1]
                  connection:
                    type: object
                    nullable: true
                    additionalProperties: false
                    required: [protocol, transport, listenPort, reality]
                    properties:
                      protocol:
                        type: string
                        enum: [vless]
                      transport:
                        type: object
                        additionalProperties: false
                        required: [type, flow]
                        properties:
                          type:
                            type: string
                            enum: [raw]
                          flow:
                            type: string
                            enum: [xtls-rprx-vision]
                      listenPort:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      reality:
                        type: object
                        additionalProperties: false
                        required: [publicKey, shortIds, serverNames]
                        properties:
                          publicKey:
                            type: string
                            description: Unpadded base64url X25519 public key derived from the persisted connection private key
                          shortIds:
                            type: array
                            items:
                              type: string
                          serverNames:
                            type: array
                            items:
                              type: string
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Invalid connection settings; no internal validation details returned
    put:
      operationId: createConnection
      summary: Create the singleton raw VLESS connection on an idle managed node
      description: Shares the users revision and serialized writer. Generates REALITY material once. Identical settings preserve secrets; divergent settings return 409. Conversion and additional listeners are unsupported.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, transport, listenPort, reality]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 1
                transport:
                  type: object
                  additionalProperties: false
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [raw]
                listenPort:
                  description: Internal VPN port; the agent management and core controller ports are rejected before persistence.
                  type: integer
                  minimum: 1
                  maximum: 65535
                reality:
                  type: object
                  additionalProperties: false
                  required: [destination, serverNames]
                  properties:
                    destination:
                      type: string
                      description: REALITY target host and port
                    serverNames:
                      type: array
                      minItems: 1
                      maxItems: 16
                      items:
                        type: string
      responses:
        '202':
          $ref: '#/components/responses/AcceptedOperation'
        '400':
          description: Invalid or unsupported transport/settings, or oversized input
        '401':
          description: Missing or invalid bearer token
        '409':
          description: Stale revision, divergent existing connection, or changed idempotent request
        '503':
          description: Managed connection state unavailable
  /api/v1/system/stats:
    get:
      operationId: getSystemStats
      summary: Read cached resource and runtime observations without I/O
      responses:
        '200':
          description: Independent latest resource/runtime envelopes, including partial or unavailable data
          content:
            application/json:
              schema:
                type: object
                required: [system, runtime]
                properties:
                  system:
                    $ref: '#/components/schemas/TelemetryLatest'
                  runtime:
                    $ref: '#/components/schemas/TelemetryLatest'
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Telemetry service unavailable
  /api/v1/connectivity:
    get:
      operationId: getConnectivity
      summary: Read cached configured outbound checks; never initiates a probe
      responses:
        '200':
          description: Latest direct node-egress observations, not VPN-path or inbound reachability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryLatest'
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Telemetry service unavailable
  /api/v1/telemetry/samples:
    get:
      operationId: getTelemetrySamples
      summary: Read a non-destructive bounded page from the 15-minute RAM stream
      parameters:
        - in: query
          name: runId
          description: Agent-run ID; supply together with after, or omit both for first page
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{32}$'
        - in: query
          name: after
          description: Decimal uint64 position exclusively after this sequence, paired with runId
          schema:
            type: string
            pattern: '^[0-9]+$'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 128
            default: 64
      responses:
        '200':
          description: Coherent retained page with cursor, eviction gap and run-change indicators; payload at most 512 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPage'
        '400':
          description: Malformed, unpaired or future cursor, invalid/duplicate/unknown query parameter
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Telemetry service unavailable
  /api/v1/traffic:
    get:
      operationId: getUserTraffic
      summary: Read approximate cumulative user payload bytes and collection health
      responses:
        '200':
          description: Durable totals including disabled identities; inspect state, stale and observedAt before using
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Traffic'
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Accounting not configured or database unavailable
  /api/v1/status:
    get:
      operationId: getRuntimeStatus
      summary: Read agent/core readiness, not end-to-end VPN health
      responses:
        '200':
          description: Pinned core controller responds and the core owns the reachable configured VPN TCP listener; not end-to-end VPN health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Core is unavailable, reports an unexpected version, or configured VPN listener ownership/reachability cannot be verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/v1/access-policy/events:
    get:
      operationId: getAccessPolicyEvents
      summary: Read retained SQL expiry evidence, independently of telemetry retention
      parameters:
        - in: query
          name: after
          schema: {type: integer, format: int64, minimum: 0, default: 0}
      responses:
        '200':
          description: The next complete revision (at most 1024 users), or empty events. Persist the whole page before advancing after to its revision. Evidence has no TTL and survives deletion and renewal.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    maxItems: 1024
                    items:
                      type: object
                      required: [revision, name, policyRevision, credentialRevision, enforcedAt]
                      properties:
                        revision: {type: integer, format: int64, minimum: 1}
                        name: {type: string}
                        policyRevision: {type: integer, format: int64, minimum: 1}
                        credentialRevision: {type: integer, format: int64, minimum: 1}
                        enforcedAt: {type: string, format: date-time}
        '400':
          description: Invalid cursor
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Durable policy storage unavailable
  /api/v1/users:
    get:
      operationId: listUsers
      summary: Read desired users and runtime reconciliation state without credentials
      responses:
        '200':
          description: Current desired users and runtime observations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users'
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Management not configured or database unavailable
  /api/v1/users/{name}:
    put:
      operationId: changeUser
      summary: Commit a user creation or enable/disable intent
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{1,64}$'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, expectedRevision]
              properties:
                accessPolicy:
                  $ref: '#/components/schemas/AccessPolicyChange'
                uuid:
                  type: string
                  format: uuid
                  writeOnly: true
                  description: Lowercase nonzero UUID required only on creation; omit for existing identity
                enabled:
                  type: boolean
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        '202':
          description: Durable intent accepted or original idempotent result; poll the operation
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOperation'
        '400':
          description: Invalid or oversized input
        '401':
          description: Missing or invalid bearer token
        '409':
          description: Missing managed connection, stale revision, identity conflict or reused idempotency key with changed body
        '503':
          description: Management not configured or database unavailable; retry identical request and key
    delete:
      operationId: deleteUser
      summary: Remove visible access while retaining revoked credentials and approximate accounting
      parameters:
        - $ref: '#/components/parameters/UserName'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        '202':
          $ref: '#/components/responses/AcceptedOperation'
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid bearer token
        '404':
          description: User not found
        '409':
          description: Stale revision or changed idempotent request
        '503':
          description: User management unavailable
  /api/v1/users/{name}/rotate:
    post:
      operationId: rotateUserCredential
      summary: Replace a user's credential, preserving enabled state and accounting
      description: A retired UUID can never be reused. A retry with the current UUID preserves credentialRevision and returns a new shared operation revision.
      parameters:
        - $ref: '#/components/parameters/UserName'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, uuid]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 1
                accessPolicy:
                  $ref: '#/components/schemas/AccessPolicyChange'
                uuid:
                  type: string
                  format: uuid
                  writeOnly: true
      responses:
        '202':
          $ref: '#/components/responses/AcceptedOperation'
        '400':
          description: Invalid input
        '401':
          description: Missing or invalid bearer token
        '404':
          description: User missing or deleted
        '409':
          description: Stale revision, retired/duplicate credential, or changed idempotent request
        '503':
          description: User management unavailable
  /api/v1/operations/{revision}:
    get:
      operationId: getUserOperation
      parameters:
        - in: path
          name: revision
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Durable outcome for this revision; session cleanup is reported separately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOperation'
        '400':
          description: Invalid revision
        '401':
          description: Missing or invalid bearer token
        '404':
          description: Operation not found
        '503':
          description: Management not configured or database unavailable
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UserName:
      in: path
      name: name
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]{1,64}$'
  responses:
    AcceptedOperation:
      description: Durable intent accepted or original idempotent result; poll operation and current appliedRevision
      headers:
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserOperation'
  securitySchemes:
    nodeToken:
      type: http
      scheme: bearer
  schemas:
    TelemetrySequence:
      type: string
      pattern: '^[0-9]+$'
      description: Unsigned 64-bit integer encoded as decimal string to preserve precision
    TelemetryCursor:
      type: object
      required: [runId, after]
      properties:
        runId:
          type: string
          pattern: '^[a-f0-9]{32}$'
        after:
          $ref: '#/components/schemas/TelemetrySequence'
    TelemetryLatest:
      type: object
      required: [runId, sample, ageSeconds, stale]
      properties:
        runId:
          type: string
          pattern: '^[a-f0-9]{32}$'
        sample:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TelemetrySample'
        ageSeconds:
          type: number
          nullable: true
          minimum: 0
          description: Elapsed time since publication; sample has separate measurement timestamps
        stale:
          type: boolean
          description: Missing sample or age exceeding three configured collection intervals
    TelemetrySample:
      type: object
      required: [runId, sequence, kind, observedAt]
      properties:
        runId:
          type: string
          pattern: '^[a-f0-9]{32}$'
        sequence:
          $ref: '#/components/schemas/TelemetrySequence'
        kind:
          type: string
          enum: [system, runtime, connectivity]
        observedAt:
          type: string
          format: date-time
        metrics:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/TelemetryMetric'
        checks:
          type: array
          maxItems: 32
          description: Absent when no connectivity targets are configured
          items:
            $ref: '#/components/schemas/ConnectivityCheck'
        runtime:
          type: object
          required: [coreState, userState]
          properties:
            coreState:
              type: string
              enum: [ready, degraded, unavailable]
            coreVersion:
              type: string
            userState:
              type: string
              enum: [not_configured, pending, retrying, observed_empty, degraded]
    TelemetryMetric:
      type: object
      required: [name, scope, unit, available, value, counter, observedAt]
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [host, container, process]
        resource:
          type: string
          description: Explicit interface, device or filesystem name; never a raw path
        unit:
          type: string
        available:
          type: boolean
        value:
          type: number
          nullable: true
          description: Gauge value, null when unavailable or represented as an integer counter
        counter:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        reason:
          type: string
          description: Safe unavailable reason code, never raw diagnostic text
        observedAt:
          type: string
          format: date-time
        windowSeconds:
          type: number
          minimum: 0
    ConnectivityCheck:
      type: object
      required: [name, type, scope, vantage, status, observedAt, rttMilliseconds, lossPercent]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [dns, tcp, https, icmp]
        scope:
          type: string
          enum: [container]
        vantage:
          type: string
          enum: [node_direct]
        status:
          type: string
          enum: [success, failed, unavailable]
        reason:
          type: string
        observedAt:
          type: string
          format: date-time
        rttMilliseconds:
          type: number
          minimum: 0
          nullable: true
        lossPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
    TelemetryPage:
      type: object
      required: [runId, firstSequence, lastSequence, headSequence, records, nextCursor, gap, runChanged, hasMore]
      properties:
        runId:
          type: string
          pattern: '^[a-f0-9]{32}$'
        firstSequence:
          $ref: '#/components/schemas/TelemetrySequence'
        lastSequence:
          $ref: '#/components/schemas/TelemetrySequence'
        headSequence:
          $ref: '#/components/schemas/TelemetrySequence'
        records:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/TelemetrySample'
        nextCursor:
          $ref: '#/components/schemas/TelemetryCursor'
        gap:
          type: boolean
          description: Requested observations were evicted; resume at earliest retained position
        runChanged:
          type: boolean
          description: Cursor belongs to another agent run; restart from earliest retained data in this run
        hasMore:
          type: boolean
          description: More retained records existed after this coherent page
    Traffic:
      type: object
      required: [approximate, pollIntervalSeconds, state, stale, observedAt, users, resetCount, skippedConnections]
      properties:
        approximate:
          type: boolean
          enum: [true]
        pollIntervalSeconds:
          type: integer
          enum: [2]
          description: Delay after each bounded collection attempt
        state:
          type: string
          enum: [starting, collecting, degraded]
        stale:
          type: boolean
          description: No committed observation or observation older than ten seconds
        observedAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          description: Sanitized collection failure
        resetCount:
          type: string
          pattern: '^[0-9]+$'
          description: Cumulative connection counter reset/rebaseline events
        skippedConnections:
          type: integer
          minimum: 0
          maximum: 16384
          description: Latest sample connections skipped due to unknown attribution, retention cutoff or capacity
        users:
          type: array
          maxItems: 1024
          items:
            type: object
            required: [name, enabled, uploadBytes, downloadBytes]
            properties:
              name:
                type: string
                description: Immutable node identity key, retained when disabled
              enabled:
                type: boolean
              uploadBytes:
                type: string
                pattern: '^[0-9]+$'
                description: Client to destination payload bytes
              downloadBytes:
                type: string
                pattern: '^[0-9]+$'
                description: Destination to client payload bytes
    Status:
      type: object
      required: [status, vpnConfigured, core, capabilities]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        vpnConfigured:
          type: boolean
          description: Whether a connection has been locally verified applied; may remain true when health is degraded
        capabilities:
          type: object
          required: [connectionCreate, userDelete, userRotate]
          properties:
            connectionCreate:
              type: boolean
            userDelete:
              type: boolean
            userRotate:
              type: boolean
            accessExpiry:
              type: boolean
              description: Supports durable local expiry and access-policy event reconciliation
        core:
          type: object
          properties:
            version:
              type: string
    AccessPolicyChange:
      type: object
      additionalProperties: false
      required: [revision, expiresAt, renew]
      description: Omission preserves existing policy for legacy callers. Revision increases per user, independently of global expectedRevision. Only an explicit newer renewal clears the expiry latch; rotation requires renew=false and preserves desired enablement. Retrying an identical rotation policy does not clear a later latch.
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: UTC deadline ending in Z, or null for unlimited access
        renew:
          type: boolean
          description: Explicit renewal; a non-null deadline must be in the future
    UserOperation:
      type: object
      required: [revision, state]
      properties:
        revision:
          type: integer
          format: int64
        state:
          type: string
          enum: [queued, applied, failed, superseded]
        error:
          type: string
          description: Sanitized application failure, retryable by the reconciler
    Users:
      type: object
      required: [revision, users, runtime]
      properties:
        revision:
          type: integer
          format: int64
        users:
          type: array
          maxItems: 1024
          items:
            type: object
            required: [name, enabled, credentialRevision]
            properties:
              name:
                type: string
              enabled:
                type: boolean
              expiresAt:
                type: [string, 'null']
                format: date-time
              policyRevision:
                type: integer
                format: int64
                minimum: 0
              expiryEnforcedRevision:
                type: integer
                format: int64
                minimum: 0
                description: Global revision which latched expiry; zero until enforced. Never changes desired enabled.
              credentialRevision:
                type: integer
                format: int64
                minimum: 1
                description: Global revision that created the current credential, or baseline 1 for imported credentials; no credential material exposed
        runtime:
          type: object
          required: [appliedRevision, cleanupState]
          properties:
            appliedRevision:
              type: integer
              format: int64
              description: This process's last locally verified revision; zero before verification
            applyingRevision:
              type: integer
              format: int64
            cleanupState:
              type: string
              enum: [pending, retrying, observed_empty]
              description: Repeated observation, never a strict drain guarantee
            error:
              type: string
