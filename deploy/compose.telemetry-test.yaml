# Overlay on reality + users test Compose; all targets stay on internal networks.
services:
  node:
    environment:
      PULSE_NODE_TELEMETRY_FILE: /fixtures/telemetry.json
      SSL_CERT_FILE: /fixtures/target.crt
    volumes:
      # Linux Docker daemon /proc. On Docker Desktop this is the Linux VM,
      # not macOS/Windows. This grants read visibility, no elevated capabilities.
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      - /proc/uptime:/host/proc/uptime:ro
      - /proc/diskstats:/host/proc/diskstats:ro
  probe:
    volumes:
      - telemetry-baseline:/telemetry-baseline
volumes:
  telemetry-baseline:
