# Optional Linux-host visibility; combine with compose.yaml (and managed overlay).
# This mounts individual metrics files, never the host root, Docker socket or all /proc.
services:
  node:
    environment:
      PULSE_NODE_TELEMETRY_FILE: /run/secrets/node_telemetry
    secrets:
      - node_telemetry
    volumes:
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      - /proc/uptime:/host/proc/uptime:ro
      - /proc/diskstats:/host/proc/diskstats:ro
secrets:
  node_telemetry:
    file: ../.local/telemetry.json
