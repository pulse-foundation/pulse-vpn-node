# Overlay on compose.reality-test.yaml; disposable services, no published ports.
services:
  database:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: pulse_test
      POSTGRES_DB: pulse_test
      POSTGRES_PASSWORD_FILE: /fixtures/postgres-password
    volumes:
      - fixtures:/fixtures:ro
      - users-database:/var/lib/postgresql/data
    networks: [back]
    depends_on:
      generate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pulse_test -d pulse_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: pulse-vpn-node:reality-test
    command: [migrate]
    environment:
      PULSE_NODE_TOKEN_FILE: /fixtures/api-token
      PULSE_NODE_DATABASE_URL_FILE: /fixtures/database-url
    volumes: ["fixtures:/fixtures:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [back]
    depends_on:
      database:
        condition: service_healthy

  node:
    environment:
      PULSE_NODE_DATABASE_URL_FILE: /fixtures/database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  second:
    image: metacubex/mihomo:v1.19.33@sha256:9211361a3ed85305383288d38c05e85862d6d5a590c10007c37fc059cca82e9c
    user: "10001:10001"
    command: [-d, /tmp/client, -f, /fixtures/second.json]
    volumes: ["fixtures:/fixtures:ro"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [front]
    depends_on:
      node:
        condition: service_healthy

volumes:
  users-database:
