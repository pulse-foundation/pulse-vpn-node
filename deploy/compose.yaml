name: pulse-vpn-node-local
services:
  node:
    image: ${PULSE_NODE_IMAGE:-pulse-vpn-node:local}
    build:
      context: ..
      target: runtime
    environment:
      PULSE_NODE_TOKEN_FILE: /run/secrets/node_api_token
    secrets:
      - node_api_token
    ports:
      - "127.0.0.1:${PULSE_NODE_PORT:-18080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run/pulse-node:rw,noexec,nosuid,size=16m,mode=0700,uid=10001,gid=10001
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 15s
    restart: "no"
    healthcheck:
      test: [CMD, /usr/local/bin/pulse-vpn-node, healthcheck]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 3
secrets:
  node_api_token:
    file: ../.local/api-token
